name: Circuit breaker
products:
  - id: nymtcbsnfhdea17y
    manufacturer: WizElek
    model: SBLYU01-40v5
entities:
  - entity: switch
    translation_key: breaker
    dps:
      - id: 16
        type: boolean
        name: switch
  - entity: sensor
    class: energy
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100
  - entity: sensor
    class: voltage
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: V
        class: measurement
        optional: true
        mask: "0000FFFF0000000000000000000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: A
        class: measurement
        optional: true
        mask: "00000000FFFFFF0000000000000000000000"
        mapping:
          - scale: 1000
            constraint: direction
            conditions:
              - dps_val: 1
                scale: -1000
      - id: 6
        type: base64
        name: direction
        optional: true
        mask: "000000000000000000000000000000000001"
  - entity: sensor
    class: power
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: kW
        class: measurement
        optional: true
        mask: "00000000000000FFFFFF0000000000000000"
        mapping:
          - scale: 1000
            constraint: direction
            conditions:
              - dps_val: 1
                scale: -1000
      - id: 6
        type: base64
        name: direction
        optional: true
        mask: "000000000000000000000000000000000002"
  - entity: sensor
    class: reactive_power
    category: diagnostic
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: kvar
        class: measurement
        optional: true
        mask: "00000000000000000000FFFFFF0000000000"
        mapping:
          - scale: 1000
            constraint: direction
            conditions:
              - dps_val: 1
                scale: -1000
      - id: 6
        type: base64
        name: direction
        optional: true
        mask: "000000000000000000000000000000000004"
  - entity: sensor
    class: apparent_power
    category: diagnostic
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: kVA
        class: measurement
        optional: true
        mask: "00000000000000000000000000FFFFFF0000"
        mapping:
          - scale: 1000
  - entity: sensor
    class: power_factor
    category: diagnostic
    dps:
      - id: 6
        type: base64
        name: sensor
        class: measurement
        optional: true
        mask: "00000000000000000000000000000000FF00"
        mapping:
          - scale: 100
            constraint: direction
            conditions:
              - dps_val: 1
                scale: -100
      - id: 6
        type: base64
        name: direction
        optional: true
        mask: "000000000000000000000000000000000008"
  - entity: sensor
    class: frequency
    category: diagnostic
    dps:
      - id: 32
        type: integer
        name: sensor
        unit: Hz
        class: measurement
        optional: true
        mapping:
          - scale: 100
  - entity: sensor
    class: temperature
    category: diagnostic
    dps:
      - id: 25
        type: integer
        name: sensor
        unit: C
        class: measurement
        optional: true
        mapping:
          - scale: 10
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 9
        type: bitfield
        name: fault_code
        optional: true
      - id: 9
        type: bitfield
        name: description
        optional: true
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: short_circuit
          - dps_val: 2
            value: surge
          - dps_val: 4
            value: overload
          - dps_val: 8
            value: earth_leak
          - dps_val: 16
            value: temperature_difference
          - dps_val: 32
            value: fire
          - dps_val: 64
            value: high_power
          - dps_val: 128
            value: self_test
          - dps_val: 256
            value: over_current
          - dps_val: 512
            value: unbalanced
          - dps_val: 1024
            value: over_voltage
          - dps_val: 2048
            value: under_voltage
          - dps_val: 4096
            value: miss_phase
          - dps_val: 8192
            value: outage
          - dps_val: 16384
            value: magnetism
          - dps_val: 32768
            value: credit_low
          - dps_val: 65536
            value: no_balance
          - dps_val: 131072
            value: leakage_warning
          - dps_val: 262144
            value: over_current_warning
          - dps_val: 524288
            value: over_voltage_warning
          - dps_val: 1048576
            value: over_power_warning
          - dps_val: 2097152
            value: under_voltage_warning
          - dps_val: 4194304
            value: high_temperature_warning
